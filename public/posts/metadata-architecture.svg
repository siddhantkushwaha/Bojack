<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, Segoe UI, sans-serif">
  <style>
    .box { fill: none; stroke: #6366f1; stroke-width: 2; }
    .box-alt { fill: none; stroke: #94a3b8; stroke-width: 2; }
    .lbl { fill: #64748b; font-size: 14px; }
    .lbl-strong { fill: #6366f1; font-size: 15px; font-weight: 600; }
    .flow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect class="box-alt" x="30" y="120" width="120" height="60" rx="10" />
  <text class="lbl" x="90" y="155" text-anchor="middle">Client</text>

  <rect class="box" x="250" y="40" width="160" height="70" rx="10" />
  <text class="lbl-strong" x="330" y="70" text-anchor="middle">Metadata plane</text>
  <text class="lbl" x="330" y="92" text-anchor="middle" font-size="12">"where do the bytes live?"</text>

  <rect class="box-alt" x="250" y="190" width="160" height="70" rx="10" />
  <text class="lbl" x="330" y="222" text-anchor="middle" font-weight="600">Data plane</text>
  <text class="lbl" x="330" y="242" text-anchor="middle" font-size="12">object storage</text>

  <rect class="box" x="490" y="40" width="120" height="70" rx="10" />
  <text class="lbl-strong" x="550" y="80" text-anchor="middle">Index shards</text>

  <path class="flow" d="M150 140 C 200 140, 200 80, 248 80" />
  <path class="flow" d="M410 80 L 488 80" />
  <path class="flow" d="M150 160 C 200 160, 200 220, 248 224" />
  <text class="lbl" x="180" y="112" font-size="12">1. lookup</text>
  <text class="lbl" x="175" y="205" font-size="12">2. stream bytes</text>
</svg>
