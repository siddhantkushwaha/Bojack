name: bojack

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bojack:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_PATH=/app/data/app.db
      # Optional: forward new subscribers to Buttondown as well as saving them
      # locally. Without a key, subscriptions are still saved to SQLite.
      - BUTTONDOWN_API_KEY=${BUTTONDOWN_API_KEY:-}
    volumes:
      # Named volume keeps the SQLite database across container restarts.
      - bojack-data:/app/data
      # Serve static files (e.g. the résumé) from the host's public/ folder.
      # Drop a new public/resume.pdf on the host and it's live on next request,
      # no image rebuild. Read-only: the app only serves these.
      - ./public:/app/public:ro
    restart: unless-stopped

volumes:
  bojack-data:
